services:
  - type: web
    name: squaddraft
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: squaddraft-postgres
          property: connectionString

databases:
  - name: squaddraft-postgres
    plan: free
    region: singapore
    databaseName: squaddraft
    user: squaddraft
